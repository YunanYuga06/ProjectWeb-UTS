<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="/login.css">
    <link rel="icon" href="/Backend/public/assets/images/Title-logo.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="wrap">
        <form id="loginForm" action="" method="POST">
            <h1>Login</h1>
            <div class="input-box">
                <input name="nama" id="username" type="text" placeholder="Username" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input name="sandi" type="password" id="password" placeholder="Password" required>
                <i class='bx bxs-lock'></i>
            </div><br>
            <p>Belum punya akun?<a href="register.html">Daftar disini</a></p><br>
            <input type="checkbox" class="check" onclick="myFunction()">Tampilkan Password<br><br>
            <button type="submit" class="button" value="Login">Login</button>
        </form>
    </div>

    <script>
        // Fungsi untuk menampilkan/menyembunyikan password
        function myFunction() {
            // ID "password" sekarang akan merujuk ke input password Anda
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }

        // Tangani submit form login menggunakan AJAX
        // Pastikan kode ini berjalan setelah DOM sepenuhnya dimuat
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginForm').addEventListener('submit', async function(event) {
                event.preventDefault(); // Mencegah pengiriman form default

                // ID "username" dan "password" sekarang akan merujuk ke input Anda
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch('http://localhost:3000/api/auth/login', { // Ganti port jika berbeda
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password }),
                    });

                    const data = await response.json();

                    if (response.ok) { // Status 2xx adalah ok
                        Swal.fire({
                            icon: 'success',
                            title: 'Login Berhasil!',
                            text: data.message,
                            showConfirmButton: false,
                            timer: 1500
                        }).then(() => {
                            // Simpan token JWT di localStorage
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('userId', data.userId);
                            localStorage.setItem('username', data.username);

                            // Redirect ke halaman dashboard atau halaman utama setelah login
                            window.location.href = 'index.html'; // Ganti dengan halaman yang sesuai
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Login Gagal!',
                            text: data.message || 'Terjadi kesalahan saat login.',
                        });
                    }
                } catch (error) {
                    console.error('Error:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error Koneksi!',
                        text: 'Tidak dapat terhubung ke server. Pastikan backend berjalan.',
                    });
                }
            });
        });
    </script>
</body>
</html>
