<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FunVac - Detail Destination</title>
  <link rel="icon" href="/assets/images/Title-logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/fontawesome.css">
  <link rel="stylesheet" href="/assets/css/templatemo-574-mexant.css">
  <link rel="stylesheet" href="/assets/css/owl.css">
  <link rel="stylesheet" href="/assets/css/animate.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    .detail-image {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 20px;
    }
    .testimonial {
      background: #f9f9f9;
      padding: 15px;
      border-left: 4px solid #0071e3;
      margin-bottom: 10px;
      border-radius: 6px;
      font-style: italic;
    }
        .back-button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

  <div class="container my-5">
    <div id="destinationDetail"></div>
    <h4 class="mt-5">Testimonials</h4>
    <div id="testimonialList"></div>
  </div>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const destinationId = queryParams.get('id');

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      const username = localStorage.getItem('username');
      const loginNavItem = document.getElementById('loginNavItem');
      const loggedInUserNavItem = document.getElementById('loggedInUserNavItem');
      const usernameDisplay = document.getElementById('usernameDisplay');

      if (token && username) {
        loginNavItem.style.display = 'none';
        usernameDisplay.textContent = username;
        loggedInUserNavItem.style.display = 'block';
      }

      fetch(`/api/destinations/${destinationId}`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('destinationDetail').innerHTML = `
            <img src="${data.imageUrl}" class="detail-image" alt="${data.name}">
            <h2>${data.name}</h2>
            <p><strong>📍 ${data.location}</strong></p>
            <p>${data.longDescription}</p>
            <p><strong>💰 ${formatCurrency(data.basePrice, data.currency)}</strong></p>
          `;
        });

      fetch(`/api/testimonials?destinationId=${destinationId}`)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('testimonialList');
          if (data.length === 0) {
            container.innerHTML = '<p class="text-muted">Belum ada testimonial.</p>';
            return;
          }
          data.forEach(t => {
            const div = document.createElement('div');
            div.className = 'testimonial';
            div.innerHTML = `"${t.quoteText}"<br><strong>- ${t.user?.username || 'Anonim'}</strong>`;
            container.appendChild(div);
          });
        });
    });

    function formatCurrency(amount, currency) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: currency || 'IDR',
        minimumFractionDigits: 0
      }).format(amount);
    }
  </script>
  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/custom.js"></script>
</body>
</html>
